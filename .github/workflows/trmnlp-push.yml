name: Push Plugin to TRMNL

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  push:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install trmnl_preview CLI
        run: gem install trmnl_preview

      - name: Configure .trmnlp.yml
        run: |
          PLUGIN_ID=$(ruby -ryaml -e 'puts YAML.load_file("src/settings.yml")["id"]')
          echo "plugin_id: ${PLUGIN_ID}" > .trmnlp.yml

      - name: Push plugin to TRMNL
        run: trmnlp push --force
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python3 scripts/release_summary.py
